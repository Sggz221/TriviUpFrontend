@if (visible()) {
    <div class="rejoin-toast" role="status" aria-live="polite">
        <div class="rejoin-toast__header">
            <span class="rejoin-toast__pulse" aria-hidden="true"></span>
            <span class="rejoin-toast__title">Partida en curso</span>
            <span class="rejoin-toast__code">{{ lastGame()!.roomCode }}</span>
            <button type="button" class="rejoin-toast__close" (click)="dismiss()" aria-label="Descartar">
                <app-icon name="x" [size]="16" />
            </button>
        </div>
        <p class="rejoin-toast__meta">
            {{ minutesAgo() === 0 ? 'Hace un momento' : 'Hace ' + minutesAgo() + ' min' }}
        </p>
        <button type="button" class="rejoin-toast__action" (click)="reconnect()">
            Reconectar →
        </button>
    </div>
}
