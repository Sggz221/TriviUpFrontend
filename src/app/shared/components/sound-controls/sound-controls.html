<button class="btn btn-circle btn-ghost sound-btn" type="button"
        [attr.aria-pressed]="audio.musicMuted()"
        [attr.aria-label]="audio.musicMuted() ? 'Activar música' : 'Silenciar música'"
        [title]="audio.musicMuted() ? 'Activar música' : 'Silenciar música'"
        (click)="audio.toggleMusicMute()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
        @if (audio.musicMuted()) {
            <line x1="3" y1="3" x2="21" y2="21" />
        }
    </svg>
</button>
<button class="btn btn-circle btn-ghost sound-btn" type="button"
        [attr.aria-pressed]="audio.muted()"
        [attr.aria-label]="audio.muted() ? 'Activar efectos de sonido' : 'Silenciar efectos de sonido'"
        [title]="audio.muted() ? 'Activar efectos de sonido' : 'Silenciar efectos de sonido'"
        (click)="audio.toggleMute()">
    @if (audio.muted()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
    } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
    }
</button>
<button class="btn btn-circle btn-ghost sound-btn" type="button"
        [attr.aria-expanded]="panelOpen()"
        aria-label="Volumen" title="Volumen"
        (click)="togglePanel()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" fill="currentColor" />
        <line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" fill="currentColor" />
        <line x1="4" y1="18" x2="20" y2="18" /><circle cx="8" cy="18" r="2" fill="currentColor" />
    </svg>
</button>
@if (panelOpen()) {
    <div class="volume-panel" role="group" aria-label="Volumen">
        <label class="volume-row">
            <span>Música</span>
            <input type="range" min="0" max="100" step="1" class="range range-xs range-primary"
                   [value]="audio.musicVolume() * 100" (input)="onMusicVolume($event)" />
            <output>{{ (audio.musicVolume() * 100).toFixed(0) }}%</output>
        </label>
        <label class="volume-row">
            <span>Efectos</span>
            <input type="range" min="0" max="100" step="1" class="range range-xs range-primary"
                   [value]="audio.sfxVolume() * 100" (input)="onSfxVolume($event)" />
            <output>{{ (audio.sfxVolume() * 100).toFixed(0) }}%</output>
        </label>
    </div>
}
